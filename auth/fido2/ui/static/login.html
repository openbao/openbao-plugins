<!doctype html>
<html>
    <head>
        <script src="./common.js"></script>
        <script src="./login.js"></script>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <div class="card">
            Alias <input id="alias" />
            <button class="button-primary" id="btn-login">Login</button>

        <div class="card">

            <button id="btn-copy-client-token">Copy Token</button>
            <button id="btn-open-ui" class="button-primary">Open UI</button>
        </div>
    </body>
</html>
